name: docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose config
        run: docker compose -f docker-compose.dev.yml config -q

      - name: Validate production compose config
        env:
          POSTGRES_PASSWORD: ci-validation-only-pg-password
          REDIS_PASSWORD: ci-validation-only-redis-password
          JWT_SECRET: ci-validation-only-jwt-secret-32chars!
          ENCRYPTION_KEY: ci-validation-only-encryption-key
          TELEGRAM_BOT_TOKEN: 1:ci
          PARTNER_WEBHOOK_SECRET: ci-validation-only-webhook-secret-32c
          PUBLIC_ORIGIN: https://ci.invalid
          MINI_APP_URL: https://ci.invalid
          BOT_USERNAME: CiBot
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Build backend image
        run: docker build -t rootswap-backend ./backend

      - name: Build bot image
        run: docker build -t rootswap-bot ./bot

      - name: Build mini-app image
        run: docker build -t rootswap-mini-app ./mini-app

      - name: Health smoke test (backend)
        run: |
          set -euo pipefail
          # Unique names per run so parallel/re-run jobs never collide, and a
          # trap guarantees cleanup even on failure (no leaked containers/network).
          RUN="${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          NET="rootswap-smoke-${RUN}"
          PG="rootswap-pg-${RUN}"
          API="rootswap-api-${RUN}"
          cleanup() {
            docker rm -f "$API" "$PG" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET"

          docker run -d --name "$PG" --network "$NET" \
            -e POSTGRES_USER=rootswap -e POSTGRES_PASSWORD=rootswap -e POSTGRES_DB=rootswap \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to become ready..."
          ready=0
          for _ in $(seq 1 30); do
            if docker exec "$PG" pg_isready -U rootswap -d rootswap >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "PostgreSQL never became ready"; docker logs "$PG"; exit 1
          fi

          docker run -d --name "$API" --network "$NET" -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+asyncpg://rootswap:rootswap@${PG}:5432/rootswap \
            -e JWT_SECRET=smoke-test-jwt-secret-32-chars-min! \
            -e PARTNER_WEBHOOK_SECRET=smoke-test-webhook-secret-32chars \
            -e RATE_LIMIT_ENABLED=false \
            rootswap-backend

          # Fail fast (with logs) if the container exits during startup —
          # e.g. a failed migration or a crashing lifespan.
          dump_and_fail() {
            echo "=== docker ps -a ==="; docker ps -a
            echo "=== api logs ==="; docker logs "$API" || true
            echo "=== pg logs (tail) ==="; docker logs --tail 50 "$PG" || true
            exit 1
          }

          echo "Waiting for backend /health ..."
          ok=0
          for _ in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$API" 2>/dev/null)" != "true" ]; then
              echo "backend container exited during startup"; dump_and_fail
            fi
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          [ "$ok" -eq 1 ] || { echo "/health never became healthy"; dump_and_fail; }

          echo "Checking backend /health/ready ..."
          if ! curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1; then
            echo "/health/ready failed"; dump_and_fail
          fi

          echo "Backend health + readiness OK"
