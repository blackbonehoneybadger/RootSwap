name: bot

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**", ".github/workflows/bot.yml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntax check
        run: python -m py_compile bot.py
