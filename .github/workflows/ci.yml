name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/rootswap-initial-e6c2

jobs:
  backend:
    name: Backend (ruff + alembic + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rootswap/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rootswap
          POSTGRES_PASSWORD: rootswap
          POSTGRES_DB: rootswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TELEGRAM_BOT_TOKEN: "0000000000:DEV_TELEGRAM_BOT_TOKEN_PLACEHOLDER"
      ENABLE_DEV_ENDPOINTS: "true"
      DATABASE_URL: postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap
      TEST_DATABASE_URL: postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_test
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rootswap/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite

      - name: Create test database
        env:
          PGPASSWORD: rootswap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U rootswap -d rootswap -c "CREATE DATABASE rootswap_test;" || true

      - name: Ruff
        run: ruff check .

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Pytest (full suite + Postgres MVP)
        run: PYTHONPATH=. pytest -v

  frontend:
    name: Mini App (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rootswap/mini-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rootswap/mini-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
