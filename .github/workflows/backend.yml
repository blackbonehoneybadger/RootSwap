name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rootswap
          POSTGRES_PASSWORD: rootswap
          POSTGRES_DB: rootswap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rootswap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Alembic migration from empty database (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests (unit + integration + e2e, with live Redis)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

      - name: E2E mock flows (explicit)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q tests/e2e --tb=short

      - name: PostgreSQL write-path smoke (real DB, not SQLite)
        # The pytest suite runs on SQLite; this exercises the order/webhook/ledger
        # money path against the actual production engine so Postgres-only
        # regressions (circular FK, flush ordering, dialect types) fail CI.
        env:
          DATABASE_URL: postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_test
          PARTNER_WEBHOOK_SECRET: pg-smoke-webhook-secret-long-enough-0
          JWT_SECRET: pg-smoke-jwt-secret-long-enough-000000
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic downgrade base
          alembic upgrade head
          python -m tests.postgres_smoke

      - name: Dependency audit (fail on high/critical)
        run: |
          pip-audit -r requirements.txt --strict \
            --vulnerability-service pypi || exit 1
