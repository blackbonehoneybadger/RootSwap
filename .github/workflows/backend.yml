name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rootswap
          POSTGRES_PASSWORD: rootswap
          POSTGRES_DB: rootswap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rootswap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Alembic migration from empty database (PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_test
          JWT_SECRET: test-jwt-secret-which-is-long-enough-000
          ENCRYPTION_KEY: "test-encryption-key-32-bytes-long!!"
          TELEGRAM_BOT_TOKEN: "1234567:test-bot-token-for-hmac"
          PARTNER_WEBHOOK_SECRET: test-webhook-secret-which-is-long-enough
        run: |
          heads=$(alembic heads)
          echo "$heads"
          test "$(echo "$heads" | wc -l)" -eq 1
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Alembic migration scenarios (PostgreSQL, fail-closed guards)
        env:
          JWT_SECRET: test-jwt-secret-which-is-long-enough-000
          ENCRYPTION_KEY: "test-encryption-key-32-bytes-long!!"
          TELEGRAM_BOT_TOKEN: "1234567:test-bot-token-for-hmac"
          PARTNER_WEBHOOK_SECRET: test-webhook-secret-which-is-long-enough
          PG_ADMIN_DSN: postgresql://rootswap:rootswap@localhost:5432/rootswap_test
        run: python -m tests.postgres_migrations

      - name: Real PostgreSQL idempotency race + saga concurrency
        env:
          JWT_SECRET: test-jwt-secret-which-is-long-enough-000
          TELEGRAM_BOT_TOKEN: "1234567:test-bot-token-for-hmac"
          PARTNER_WEBHOOK_SECRET: test-webhook-secret-which-is-long-enough
          PGPASSWORD: rootswap
        run: |
          # This probe creates real orders that encrypt the wallet address, so a
          # valid Fernet key is required. Generate one at runtime rather than
          # committing a high-entropy literal (which a secret scanner flags).
          export ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          # A dedicated database so the concurrency probe never races the
          # pytest suite. Real MVCC + unique constraints are required to
          # exercise the two-worker INSERT race that SQLite cannot reproduce.
          # Connect to the service's default DB (rootswap_test) to create it.
          psql -h localhost -U rootswap -d rootswap_test -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS rootswap_conc" \
            -c "CREATE DATABASE rootswap_conc"
          DATABASE_URL=postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_conc \
            alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_conc \
            python -m tests.postgres_concurrency

      - name: Tests (unit + integration + e2e, with live Redis)
        env:
          REDIS_URL: redis://localhost:6379/0
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://rootswap:rootswap@localhost:5432/rootswap_test
        run: pytest -q

      - name: E2E mock flows (explicit)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q tests/e2e --tb=short

      - name: Dependency audit (fail on high/critical)
        run: |
          pip-audit -r requirements.txt --strict \
            --vulnerability-service pypi || exit 1
