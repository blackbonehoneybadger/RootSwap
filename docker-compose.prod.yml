# Production compose.
# - Postgres/Redis are NOT exposed to the host.
# - Only nginx publishes ports 80/443.
# - All secrets come from the environment / .env (never committed).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rootswap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: rootswap
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootswap"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://rootswap:${POSTGRES_PASSWORD:?}@postgres:5432/rootswap
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:?PARTNER_WEBHOOK_SECRET is required}
      ALLOW_MOCK_PARTNERS: "false"
      ALLOW_SANDBOX_PARTNERS: "false"
      POLLING_ENABLED: "true"
      NOTIFICATIONS_ENABLED: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-{}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: ./bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      MINI_APP_URL: ${MINI_APP_URL:?MINI_APP_URL is required}
    restart: unless-stopped
    depends_on:
      - api

  mini-app:
    build:
      context: ./mini-app
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_BOT_USERNAME: ${BOT_USERNAME:?BOT_USERNAME is required}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      - api
      - mini-app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
