# Local secret-scanning safety net, mirroring the `gitleaks` CI job so a secret
# is caught before it ever reaches a commit (removing it afterwards requires
# rewriting history — the scanner reads the whole commit range, not just HEAD).
#
# Enable once per clone:
#     pip install pre-commit && pre-commit install
#
# Run against everything already committed:
#     pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Picks up .gitleaks.toml from the repo root, so local and CI behaviour
        # stay identical.
